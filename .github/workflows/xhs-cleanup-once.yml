name: XHS Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/xhs-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary extraction files
        shell: bash
        run: |
          git rm -rf --ignore-unmatch \
            .github/workflows/xhs-images-and-ocr-once.yml \
            .github/workflows/xhs-zip-chunks-once.yml \
            .github/workflows/xhs-cleanup-once.yml \
            scripts/xhs_images_and_ocr_once.py \
            xhs-image-export/chunks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Xiaohongshu extraction files' || exit 0
          git push origin HEAD:main
